<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Formation — D2MG Pilotage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --violet:#5B3A8C; --violet-fonce:#3F2766; --violet-clair:#F1ECF8;
  --vert:#1E7B34; --vert-clair:#E3F1E6; --orange:#D9661F; --orange-clair:#FDF1E7;
  --rouge:#C0392B; --rouge-clair:#FBEAE8; --bleu:#1F6FB2; --bleu-clair:#E9F2FA;
  --gris-900:#1C2529; --gris-700:#3E4C54; --gris-500:#6B7A82; --gris-300:#C9D3D8; --gris-200:#E2E9EC; --gris-100:#F4F6F8;
  --ombre:0 1px 3px rgba(16,32,40,.08),0 4px 14px rgba(16,32,40,.06); --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--gris-100);color:var(--gris-900);font-size:14px;line-height:1.5}
.hidden{display:none !important}
h1,h2,h3,h4{margin:0 0 8px;font-weight:600} h1{font-size:21px} h2{font-size:17px} h3{font-size:15px} h4{font-size:14px}
p{margin:0 0 8px}
button,input,select,textarea{font-family:inherit;font-size:14px}
.ecran{min-height:100vh;display:grid;place-items:center;padding:24px}
.boiteEcran{background:#fff;border:1px solid var(--gris-300);border-radius:var(--radius);box-shadow:var(--ombre);padding:32px;max-width:500px;text-align:center}
.boiteEcran h2{color:var(--violet)}

.app{display:flex;min-height:100vh}
.barre{width:236px;flex:0 0 236px;background:var(--violet-fonce);color:#fff;padding:14px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.barre .logo{padding:0 16px 14px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:10px}
.barre .logo b{display:block;font-size:15px} .barre .logo span{font-size:11px;opacity:.8}
.barre .qui{font-size:11.5px;background:rgba(255,255,255,.11);border-radius:9px;padding:8px 10px;margin:0 14px 12px;line-height:1.45}
.barre .qui strong{display:block;font-size:12.5px}
.menu{list-style:none;margin:0;padding:0;flex:1}
.menu a{display:flex;gap:9px;align-items:center;padding:9px 16px;color:#e9e1f5;text-decoration:none;cursor:pointer;border-left:3px solid transparent;font-size:13.4px}
.menu a:hover{background:rgba(255,255,255,.07)}
.menu a.actif{background:rgba(255,255,255,.13);border-left-color:#F3B562;color:#fff;font-weight:600}
.menu .sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;padding:12px 16px 4px}
.barre .bas{padding:10px 14px;border-top:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:6px}
.barre .bas button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:7px;cursor:pointer;font-size:12.5px}
.contenu{flex:1;min-width:0;padding:22px 28px 60px}

.carte{background:#fff;border:1px solid var(--gris-200);border-radius:var(--radius);box-shadow:var(--ombre);padding:18px 20px;margin-bottom:16px}
.entete-page{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.entete-page p{color:var(--gris-500);margin:2px 0 0}
.btn{border:1px solid var(--gris-300);background:#fff;color:var(--gris-900);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--violet)}
.btn.prim{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.prim:hover{background:var(--violet-fonce)}
.btn.vert{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.liens{display:flex;gap:8px;flex-wrap:wrap}

.prog{height:10px;background:var(--gris-200);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),#8E6CC4);border-radius:99px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 4px}
.kpi{background:var(--violet-clair);border-radius:10px;padding:10px 12px}
.kpi .v{font-size:20px;font-weight:700;color:var(--violet-fonce)} .kpi .l{font-size:12px;color:var(--gris-700)}

.module{background:#fff;border:1px solid var(--gris-200);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:var(--ombre)}
.module .tete{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.module .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--gris-200);color:var(--gris-700);flex:0 0 36px}
.module.fait .num{background:var(--vert);color:#fff}
.module.encours .num{background:var(--violet);color:#fff}
.module .tete h3{margin:0;font-size:14.5px} .module .tete .ep{font-size:12px;color:var(--gris-500)}
.module .tete .etat{margin-left:auto;font-size:12px;color:var(--gris-500);white-space:nowrap}
.module .corps{border-top:1px solid var(--gris-200)}
.ligne{display:flex;align-items:center;gap:12px;padding:9px 16px 9px 64px;border-bottom:1px solid var(--gris-100)}
.ligne:last-child{border-bottom:0}
.ligne .ic{width:22px;text-align:center}
.ligne .lib{flex:1} .ligne .lib small{display:block;color:var(--gris-500);font-size:12px}
.pastille{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.pastille.ok{background:var(--vert-clair);color:var(--vert)} .pastille.go{background:var(--violet-clair);color:var(--violet)}
.pastille.lock{background:var(--gris-200);color:var(--gris-500)} .pastille.ko{background:var(--rouge-clair);color:var(--rouge)}
.pastille.att{background:var(--orange-clair);color:var(--orange)}
.seul{padding-left:16px}

.fil{font-size:12.5px;color:var(--gris-500);margin-bottom:10px} .fil a{color:var(--violet);cursor:pointer;text-decoration:underline}
.question{border:1px solid var(--gris-200);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
.question .enonce{font-weight:600;margin-bottom:8px}
.question label{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.question label:hover{background:var(--gris-100)}
.question label.bonne{background:var(--vert-clair)} .question label.fausse{background:var(--rouge-clair)}
.question .expl{font-size:12.5px;color:var(--gris-700);margin-top:6px;background:var(--gris-100);border-radius:8px;padding:7px 10px}
.encadre{border-radius:10px;padding:12px 14px;margin-bottom:14px}
.encadre.info{background:var(--bleu-clair)} .encadre.ok{background:var(--vert-clair)} .encadre.ko{background:var(--rouge-clair)} .encadre.att{background:var(--orange-clair)}
.score{font-size:34px;font-weight:700;color:var(--violet-fonce)}

video{width:100%;max-width:900px;border-radius:10px;background:#000;display:block}
.diapo{max-width:960px} .diapo img{width:100%;border-radius:10px;border:1px solid var(--gris-200);display:block;background:#fff;min-height:200px}
.vignettes{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.vignettes button{width:32px;height:28px;border-radius:6px;border:1px solid var(--gris-300);background:#fff;cursor:pointer;font-size:12px}
.vignettes button.vue{background:var(--vert-clair);border-color:var(--vert)}
.vignettes button.cour{background:var(--violet);color:#fff;border-color:var(--violet)}
.fiche{max-width:860px} .fiche h4{color:var(--violet);margin-top:16px}
.fiche table{border-collapse:collapse;width:100%;margin:8px 0}
.fiche th,.fiche td{border:1px solid var(--gris-300);padding:6px 9px;text-align:left;vertical-align:top}
.fiche th{background:var(--violet-clair)}
.carnet label{display:block;font-weight:600;margin:12px 0 5px}
.carnet textarea{width:100%;min-height:62px;border:1px solid var(--gris-300);border-radius:8px;padding:8px 10px;resize:vertical}

table.liste{border-collapse:collapse;width:100%;background:#fff;font-size:13px}
table.liste th,table.liste td{border-bottom:1px solid var(--gris-200);padding:8px 9px;text-align:left;vertical-align:middle}
table.liste th{background:var(--gris-100);font-size:12px;color:var(--gris-700);position:sticky;top:0}
.defile{overflow:auto;border:1px solid var(--gris-200);border-radius:10px}
.mini{font-size:12px;color:var(--gris-500)}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--gris-900);color:#fff;padding:10px 14px;border-radius:9px;box-shadow:var(--ombre);max-width:380px;font-size:13px}
.toast.ok{background:var(--vert)} .toast.err{background:var(--rouge)}


/* ---- La chambre : cartes des parcours ---- */
.grille-parcours{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.carte-parcours{background:#fff;border:1px solid var(--gris-200);border-top:5px solid var(--c);border-radius:var(--radius);box-shadow:var(--ombre);padding:16px 18px;display:flex;flex-direction:column}
.carte-parcours h2{color:var(--c);margin:8px 0 4px}
.carte-parcours .liens{margin-top:auto !important;padding-top:12px}
.cp-tete{display:flex;justify-content:space-between;align-items:center}
.cp-ic{font-size:28px}
.form-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 16px;margin-bottom:10px}
label.bloc,.form-grille label{display:block;font-size:12.5px;font-weight:600;color:var(--gris-700);margin:6px 0}
label.bloc input,label.bloc select,label.bloc textarea,.form-grille input{display:block;width:100%;margin-top:4px;border:1px solid var(--gris-300);border-radius:8px;padding:7px 9px;font-weight:400;color:var(--gris-900)}
table.liste select{border:1px solid var(--gris-300);border-radius:7px;padding:4px 6px}

/* ---- Certificat / attestation à imprimer ---- */
#impression{display:none}
.doc-a4{width:297mm;height:210mm;background:#fff;margin:0 auto;padding:9mm;position:relative}
.doc-cadre{border:5px double var(--vert);height:100%;padding:8mm 14mm 6mm;display:flex;flex-direction:column;font-family:"Arial Narrow",Arial,sans-serif}
.doc-tete{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;font-size:9.5pt;font-weight:700;text-align:center;line-height:1.3}
.doc-tete img{width:110px;display:block;margin:0 auto 3px}
.doc-titre{text-align:center;color:var(--vert);font-weight:700;letter-spacing:2px;margin-top:6mm}
.doc-sous{text-align:center;color:var(--orange);font-weight:700;font-size:13pt;margin:1mm 0 6mm}
.doc-c{text-align:center;font-size:13pt;margin:0 0 2mm}
.doc-nom{text-align:center;font-size:26pt;font-weight:700;color:var(--vert);margin:1mm 0 0}
.doc-fct{text-align:center;color:#595959;font-size:12pt;margin-bottom:5mm}
.doc-note{text-align:center;font-size:11pt;font-style:italic;color:#595959;margin-top:2mm}
.doc-pied{margin-top:auto;display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:10mm;align-items:end}
.doc-qr{font-size:8.5pt;color:#595959} .doc-qr .qr{width:92px;height:92px;margin-bottom:3px}
.doc-ref{border-collapse:collapse;font-size:10pt;width:100%}
.doc-ref td{border:1px solid #A6A6A6;padding:3px 7px} .doc-ref td:first-child{background:var(--vert-clair);font-weight:700;width:42%}
.doc-sign{text-align:center;font-size:11pt} .doc-sign .nom{font-weight:700;font-size:12pt;margin-top:16mm}
.doc-bas{text-align:center;font-size:7.5pt;color:#595959;margin-top:3mm}
.doc-annule{position:absolute;inset:0;display:grid;place-items:center;font-size:70pt;color:rgba(192,57,43,.25);font-weight:800;transform:rotate(-18deg);pointer-events:none}
.apercu-doc{overflow:auto;background:var(--gris-200);padding:16px;border-radius:10px}
.apercu-doc .doc-a4{transform-origin:top left}
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff}
  .app,.toasts,#ecranAcces,#ecranChargement{display:none !important}
  #impression{display:block !important}
}
@media (max-width:900px){ .ligne{padding-left:16px} }
/* ---- Bande latérale rétractable (bureau) / tiroir (tablette, smartphone) ---- */
.btnMenu{display:none;position:fixed;top:14px;left:14px;z-index:220;width:36px;height:36px;border:none;border-radius:9px;background:var(--violet);color:#fff;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);align-items:center;justify-content:center}
body:has(#app:not(.hidden)) .btnMenu{display:flex}
.fondMenu{display:none;position:fixed;inset:0;background:rgba(15,23,32,.45);z-index:210}
.fondMenu.visible{display:block}
.barre .logo{margin-top:44px}
.barre{transition:width .22s ease,flex-basis .22s ease,padding .22s ease,transform .22s ease}
.barre.menuReplie{width:0 !important;flex:0 0 0 !important;padding:0 !important;overflow:hidden}
.barre.menuReplie ~ .contenu{padding-left:64px}
@media (max-width:900px){
  .barre{position:fixed;top:0;left:0;height:100vh;z-index:215;width:236px;flex:none;transform:translateX(-101%)}
  .barre.menuOuvert{transform:translateX(0);box-shadow:0 0 26px rgba(0,0,0,.3)}
  .barre.menuReplie{width:236px !important;flex:none !important;padding:14px 0 !important;overflow:visible}
  .contenu,.barre.menuReplie ~ .contenu{padding:60px 16px 40px}
}
@media print{ .btnMenu,.fondMenu{display:none !important} }

</style>
</head>
<body>
<div id="ecranChargement" class="ecran"><div class="boiteEcran"><h2>🎓 Formation</h2><p>Chargement…</p></div></div>
<div id="ecranAcces" class="ecran hidden"><div class="boiteEcran"><h2>🎓 Formation</h2><p id="msgAcces"></p><p><a href="index.html">Retour à l'accueil D2MG Pilotage</a></p></div></div>

<button type="button" class="btnMenu" id="btnMenu" onclick="toggleMenuLateral()" title="Afficher/masquer le menu" aria-label="Afficher/masquer le menu">☰</button>
<div class="fondMenu" id="fondMenu" onclick="fermerMenuMobile()"></div>
<div id="app" class="app hidden">
  <aside class="barre">
    <div class="logo"><b>🎓 Formation</b><span>Les parcours de formation de D2MG Pilotage</span></div>
    <div class="qui" id="qui"></div>
    <ul class="menu" id="menu"></ul>
    <div class="bas">
      <button type="button" data-act="accueil">← Accueil D2MG Pilotage</button>
      <button type="button" data-act="deconnexion">Se déconnecter</button>
    </div>
  </aside>
  <main class="contenu" id="contenu"></main>
</div>
<div id="impression"></div>
<div class="toasts" id="toasts"></div>
<script>
(function(){
  function cote(){ return document.querySelector('.barre'); }
  function fond(){ return document.getElementById('fondMenu'); }
  function estMobile(){ return window.matchMedia('(max-width:900px)').matches; }
  window.appliquerEtatMenu = function(){
    var c = cote(); if (!c) return;
    var replie = false;
    try { replie = localStorage.getItem('d2mgMenuReplie') === '1'; } catch(e){}
    c.classList.toggle('menuReplie', replie && !estMobile());
    c.classList.remove('menuOuvert');
    var f = fond(); if (f) f.classList.remove('visible');
  };
  window.toggleMenuLateral = function(){
    var c = cote(); if (!c) return;
    if (estMobile()){
      var ouvert = c.classList.toggle('menuOuvert');
      var f = fond(); if (f) f.classList.toggle('visible', ouvert);
    } else {
      var replie = c.classList.toggle('menuReplie');
      try { localStorage.setItem('d2mgMenuReplie', replie ? '1' : '0'); } catch(e){}
    }
  };
  window.fermerMenuMobile = function(){
    var c = cote(); if (!c) return;
    c.classList.remove('menuOuvert');
    var f = fond(); if (f) f.classList.remove('visible');
  };
  document.addEventListener('DOMContentLoaded', appliquerEtatMenu);
  window.addEventListener('resize', appliquerEtatMenu);
})();
</script>
<script src="formation-app.js"></script>
</body>
</html>
